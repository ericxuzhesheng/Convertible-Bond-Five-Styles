name: Weekly research update

on:
  schedule:
    - cron: '1 11 * * 1-5'
  workflow_dispatch:
    inputs:
      force_update:
        description: Rebuild even when the cutoff is not the week's last session
        type: boolean
        default: false
      end_date:
        description: Optional cutoff YYYYMMDD (Beijing today if empty)
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: weekly-research
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
      MPLBACKEND: Agg
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - uses: actions/cache/restore@v4
        with:
          path: data/research.sqlite
          key: research-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: research-v2-
      - name: Check the last trading session
        id: calendar
        env:
          REQUESTED_END: ${{ inputs.end_date }}
        run: |
          args=()
          if [ -n "$REQUESTED_END" ]; then
            args+=(--end "$REQUESTED_END")
          elif [ "$GITHUB_EVENT_NAME" = schedule ]; then
            args+=(--scheduled)
          fi
          python strategy.py week-check "${args[@]}"
      - name: Validate and rebuild
        if: steps.calendar.outputs.should_update == 'true' || inputs.force_update == true
        env:
          CUTOFF: ${{ steps.calendar.outputs.date }}
        run: |
          python strategy.py self-test
          python strategy.py run --start 20190101 --end "$CUTOFF" --out results/weekly_candidate
          python strategy.py publish --out results/weekly_candidate
      - name: Publish complete results
        if: steps.calendar.outputs.should_update == 'true' || inputs.force_update == true
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md examples
          if ! git diff --cached --quiet; then
            git commit -m "Update weekly research through ${{ steps.calendar.outputs.date }}"
            git push
          fi
      - uses: actions/cache/save@v4
        if: always() && hashFiles('data/research.sqlite') != ''
        with:
          path: data/research.sqlite
          key: research-v2-${{ github.run_id }}-${{ github.run_attempt }}
